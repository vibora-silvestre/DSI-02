<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promoção Madeira e Cia</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f5f4;
            color: #333;
        }

        /* Cabeçalho */

        header {
            background: #683904;
            color: white;
            text-align: center;
            padding: 30px 20px; 
             }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

            main {
            min-height: calc(100vh - 130px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

               .formulario {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .formulario h2 {
            color: #683904;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Campos */

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #683904;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fafafa;
            transition: 0.3s;
        }

        /* Quando o usuário clica no campo */

        input:focus,
        select:focus {
            outline: none;
            border-color: #683904;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
            background-color: white;
        }

        /* Botão */

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #683904;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #683904;
        }

        /* Responsividade */

        @media (max-width: 600px) {

            .formulario {
                padding: 25px 20px;
            }

            header h1 {
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

    <header>
        <h1>PROMOÇÃO MADEIRA E CIA LTDA</h1>
        <p>Calcule o valor da sua compra</p>
    </header>

    <main>

        <form class="formulario" method="post" action="agenda03.php">

            <h2>Dados da Compra</h2>

            <div class="campo">
                <label for="nome_cliente">
                    Nome do cliente
                </label>

                <input type="text" id="nome_cliente" name="nome_cliente" placeholder="Digite o nome do cliente" required>
            </div>

            <div class="campo">
                <label for="valor_compra">
                    Valor da compra
                </label>

                <input class="w3-input w3-border w3-light-grey" type="text" id="valor_compra" name="valor_compra" required>
            </div>

            <div class="campo">
                <label for="forma_pagamento">
                    Forma de pagamento
                </label>

                <select
                    id="forma_pagamento"
                    name="forma_pagamento"
                    required
                >
                    <option value="" disabled selected>
                        Selecione uma opção
                    </option>

                    <option value="deposito">
                        Depósito Bancário
                    </option>

                    <option value="boleto">
                        Boleto Bancário
                    </option>

                    <option value="cartao">
                        Cartão de crédito
                    </option>
                </select>
            </div>

            <button type="submit">
                Calcular
            </button>

        </form>

    </main>

</body>

</html>
